[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regime"
version = "1.0.0"
description = "Two-layer regime-router + condition-specialist cocoa algorithm (shadow)"
requires-python = ">=3.12"
# Pinned to the fit-time lib set so fit == declared == infer (manifest.lib_versions).
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scikit-learn==1.6.1",
  "scipy==1.14.1",
  "lightgbm==4.5.0",
  "pyarrow>=15",
]

[tool.setuptools]
packages = ["regime"]
