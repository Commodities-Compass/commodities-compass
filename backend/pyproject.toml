[tool.poetry]
name = "commodities-compass"
version = "1.0.0"
description = "Business Intelligence application for commodities trading"
authors = ["Your Name <email@example.com>"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
# Pinned <3.13 to satisfy the vendored campaign5_ensemble package (numpy 1.26.4
# + arch + hmmlearn lock the upper bound; revisit when R&D bumps numpy 2).
python = ">=3.11,<3.13"
# Core
fastapi = "^0.136.0"
uvicorn = {version = "^0.44.0", extras = ["standard"]}
python-multipart = "^0.0.9"

# Database
sqlalchemy = "^2.0.27"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
asyncpg = "^0.29.0"
greenlet = ">=3.0.0"

# Data Processing — pinned to versions that satisfy both the indicator engine
# and the vendored Campaign 5 ensemble (R&D requires numpy==1.26.4 + pandas<2.3
# for reproducibility of the frozen ML artifacts).
pandas = ">=2.1,<2.3"
numpy = "==1.26.4"
scipy = ">=1.11,<1.13"
scikit-learn = ">=1.4,<1.6"
lightgbm = ">=4.1,<4.5"
arch = "^6.3"
hmmlearn = "^0.3"
optuna = "^3.5"

# Authentication
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
python-decouple = "^3.8"

# API & Validation
pydantic = "^2.6.1"
pydantic-settings = "^2.1.0"

# Google Drive API
google-api-python-client = "^2.118.0"
google-auth-httplib2 = "^0.2.0"

# Observability
sentry-sdk = {extras = ["fastapi", "sqlalchemy", "httpx"], version = "^2.0.0"}

# Utilities
httpx = "^0.28.0"
slowapi = "^0.1.9"
python-dateutil = "^2.8.2"
pytz = "^2024.1"
playwright = "^1.58.0"
beautifulsoup4 = "^4.14.3"
xlrd = "^2.0.1"

# LLM Providers (press review agent)
anthropic = "^0.95.0"
openai = "^2.0.0"
google-genai = "^1.0.0"
cachetools = "^7.0.5"

# Campaign 5 ensemble — vendored R&D delivery. Frozen at v1.0.0 (TRAINING_CUTOFF
# 2026-04-30). Path dep: re-extract tarball + bump path on each new R&D release.
# Key name "ensemble" must match the R&D package's pyproject `name`.
ensemble = {path = "vendor/campaign5_ensemble_v1.0.0", develop = false}
pyarrow = "^24.0.0"
pdfplumber = "^0.11.9"
openpyxl = "^3.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-asyncio = "^1.0.0"
pytest-cov = "^5.0.0"
aiosqlite = "^0.20.0"
ruff = "^0.15.0"
pyright = "^1.1.350"
pre-commit = "^4.0.0"

[tool.poetry.scripts]
dev = "app.main:main"
lint = "app.lint:main"
barchart-scraper = "scripts.barchart_scraper.main:main"
ice-stocks-scraper = "scripts.ice_stocks_scraper.main:main"
cftc-scraper = "scripts.cftc_scraper.main:main"
press-review = "scripts.press_review_agent.main:main"
daily-analysis = "scripts.daily_analysis.main:main"
compass-brief = "scripts.compass_brief.main:main"
meteo-agent = "scripts.meteo_agent.main:main"
enso-scraper = "scripts.enso_scraper.main:main"
enso-scraper-backfill = "scripts.enso_scraper.backfill:main"
fx-scraper = "scripts.fx_scraper.main:main"
fx-scraper-backfill = "scripts.fx_scraper.backfill:main"
ice-cot-eu-scraper = "scripts.ice_cot_eu_scraper.main:main"
ice-cot-eu-scraper-backfill = "scripts.ice_cot_eu_scraper.backfill:main"
barchart-stocks-eu-scraper = "scripts.barchart_stocks_eu_scraper.main:main"
barchart-stocks-eu-scraper-backfill = "scripts.barchart_stocks_eu_scraper.backfill:main"
eca-grindings-scraper = "scripts.eca_grindings_scraper.main:main"
eca-grindings-scraper-backfill = "scripts.eca_grindings_scraper.backfill:main"
nca-grindings-scraper = "scripts.nca_grindings_scraper.main:main"
nca-grindings-scraper-backfill = "scripts.nca_grindings_scraper.backfill:main"
publication-calendar-watchdog = "scripts.publication_calendar_watchdog.main:main"
roll-watchdog = "scripts.roll_watchdog.main:main"
intraday-monitor = "scripts.intraday_monitor.main:main"
publish-session = "scripts.publish_session.main:main"
ensemble-explainer = "scripts.ensemble_explainer.main:main"
compass-brief-ensemble = "scripts.compass_brief_ensemble.main:main"
ensemble-bootstrap-artifacts = "scripts.ensemble_bootstrap.main:main"
ensemble-compute = "scripts.ensemble_compute.main:main"
regime-bootstrap-artifacts = "scripts.regime_shadow.bootstrap:main"
regime-shadow-compute = "scripts.regime_shadow.main:main"
judge-shadow-compute = "scripts.judge_shadow.main:main"
seed-gcp = "scripts.seed_gcp:main"
seed-trading-calendar = "scripts.seed_trading_calendar:main"
seed-historical-csv = "scripts.seed_historical_csv:main"
compute-indicators = "app.engine.runner:main"
compute-gauges = "scripts.compute_gauges.main:main"
regime-brief = "scripts.regime_brief.main:main"
compute-sentiment-features = "scripts.compute_sentiment_features.main:main"
roll-contract = "scripts.roll_contract:main"
set-farmgate-price = "scripts.set_farmgate_price:main"
create-tenant = "scripts.tenant_admin:create_tenant"
link-seat = "scripts.tenant_admin:link_seat"
grant-entitlement = "scripts.tenant_admin:grant_entitlement"
revoke-entitlement = "scripts.tenant_admin:revoke_entitlement"
set-tier = "scripts.tenant_admin:set_tier"
map-exporter = "scripts.tenant_admin:map_exporter"
demo-set-tier = "scripts.demo_tier:main"
watchlist-eval = "scripts.watchlist_eval.main:main"
backtest-seasonal = "scripts.seasonal_backtest.main:main"
julien-handoff = "scripts.julien_handoff.main:main"
watchai-sync = "scripts.watchai_sync.main:main"

[tool.ruff]
# Vendored R&D code lives under its own pyproject/ruff settings and ships
# pre-linted — exclude it from our linting to avoid noise.
extend-exclude = ["vendor"]

[tool.pyright]
include = ["app", "tests"]
# Vendored R&D code has its own type contract; exclude to avoid duplicating
# pyright runs and to not block our CI on R&D-side stubs missing.
exclude = ["scripts", "vendor"]
# regime + judge are vendored but NOT pip-installed (regime pins sklearn==1.6.1
# which would force the backend image up; judge ships without a pyproject — both
# run via sys.path append at import time — see scripts/{regime,judge}_shadow/
# __init__.py). Point pyright at the vendored packages so `import regime.*` /
# `import judge.*` resolve in tests without installing them.
extraPaths = ["vendor/regime_v1.0.0", "vendor/judge_v0.1"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --cov=app --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
