name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/commodities-compass
  SA_API: cc-cloud-run-api@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  SA_JOBS: cc-cloud-run-jobs@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  VPC_CONNECTOR: cc-vpc-connector

jobs:
  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Build and push backend image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/backend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/backend:latest \
            backend/
          docker push --all-tags ${{ env.REGISTRY }}/backend

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: backend
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.REGISTRY }}/backend:${{ github.sha }}
          flags: >-
            --service-account=${{ env.SA_API }}
            --vpc-connector=${{ env.VPC_CONNECTOR }}
            --vpc-egress=private-ranges-only
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=2
            --port=8000
            --allow-unauthenticated
          # ENTITLEMENTS_ENFORCED: the per-client visibility boundary. Defaults to
          # 'false' (dark) so this deploy changes nothing. Flip by setting the GitHub
          # var to 'true' and redeploying — but ONLY once every live Auth0 login holds
          # a seat (poetry run seed-internal-tenants --dry-run must show no '+' left),
          # because an unseeded login default-denies to a blank dashboard.
          env_vars: |
            GOOGLE_DRIVE_AUDIO_FOLDER_ID=${{ vars.GOOGLE_DRIVE_AUDIO_FOLDER_ID }}
            BACKEND_CORS_ORIGINS=${{ vars.BACKEND_CORS_ORIGINS }}
            GIT_COMMIT_SHA=${{ github.sha }}
            ENTITLEMENTS_ENFORCED=${{ vars.ENTITLEMENTS_ENFORCED || 'false' }}
          # AUDIO_URL_SECRET: HMAC key for the signed /audio/stream capability token.
          # Read only when ENTITLEMENTS_ENFORCED is on, and signing fails loud when it
          # is empty — so the secret must exist BEFORE that flag flips. Service only:
          # no Cloud Run Job streams audio.
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            DATABASE_SYNC_URL=DATABASE_SYNC_URL:latest
            AUTH0_DOMAIN=AUTH0_DOMAIN:latest
            AUTH0_CLIENT_ID=AUTH0_CLIENT_ID:latest
            AUTH0_API_AUDIENCE=AUTH0_API_AUDIENCE:latest
            AUTH0_ISSUER=AUTH0_ISSUER:latest
            GOOGLE_DRIVE_CREDENTIALS_JSON=GOOGLE_DRIVE_CREDENTIALS_JSON:latest
            SENTRY_DSN=SENTRY_DSN:latest
            AUDIO_URL_SECRET=AUDIO_URL_SECRET:latest

  deploy-frontend:
    name: Deploy Frontend to Cloud Run
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Fetch SENTRY_DSN from GCP Secret Manager
        id: sentry-dsn
        run: |
          DSN=$(gcloud secrets versions access latest --secret=SENTRY_DSN --project=${{ vars.GCP_PROJECT_ID }})
          echo "::add-mask::$DSN"
          echo "value=$DSN" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg AUTH0_DOMAIN=${{ vars.AUTH0_DOMAIN }} \
            --build-arg AUTH0_CLIENT_ID=${{ vars.AUTH0_CLIENT_ID }} \
            --build-arg AUTH0_API_AUDIENCE=${{ vars.AUTH0_API_AUDIENCE }} \
            --build-arg AUTH0_REDIRECT_URI=${{ vars.FRONTEND_URL }} \
            --build-arg API_BASE_URL=${{ vars.API_BASE_URL }} \
            --build-arg AUTH0_ISSUER=${{ vars.AUTH0_ISSUER }} \
            --build-arg SENTRY_DSN=${{ steps.sentry-dsn.outputs.value }} \
            --build-arg GIT_COMMIT_SHA=${{ github.sha }} \
            --build-arg SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }} \
            --build-arg ENVIRONMENT=production \
            --build-arg VITE_FEATURE_LANG_SWITCHER=${{ vars.VITE_FEATURE_LANG_SWITCHER || 'false' }} \
            -t ${{ env.REGISTRY }}/frontend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/frontend:latest \
            frontend/
          docker push --all-tags ${{ env.REGISTRY }}/frontend

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: frontend
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          flags: >-
            --service-account=${{ env.SA_API }}
            --memory=256Mi
            --cpu=1
            --min-instances=0
            --max-instances=2
            --port=3000
            --allow-unauthenticated

  deploy-jobs:
    name: Deploy Cloud Run Jobs
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Build and push jobs image
        run: |
          docker build \
            -f backend/Dockerfile.jobs \
            -t ${{ env.REGISTRY }}/jobs:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/jobs:latest \
            backend/
          docker push --all-tags ${{ env.REGISTRY }}/jobs

      - name: Deploy Cloud Run Jobs
        run: |
          IMAGE="${{ env.REGISTRY }}/jobs:${{ github.sha }}"
          REGION="${{ vars.GCP_REGION }}"
          SA="${{ env.SA_JOBS }}"
          VPC="${{ env.VPC_CONNECTOR }}"

          COMMON_FLAGS="--region=${REGION} --service-account=${SA} --vpc-connector=${VPC} --vpc-egress=private-ranges-only --max-retries=0 --task-timeout=900s"

          SECRETS="--set-secrets=DATABASE_URL=DATABASE_URL:latest,DATABASE_SYNC_URL=DATABASE_SYNC_URL:latest,GOOGLE_SHEETS_CREDENTIALS_JSON=GOOGLE_SHEETS_CREDENTIALS_JSON:latest,GOOGLE_SHEETS_SCRAPER_CREDENTIALS_JSON=GOOGLE_SHEETS_SCRAPER_CREDENTIALS_JSON:latest,GOOGLE_DRIVE_CREDENTIALS_JSON=GOOGLE_DRIVE_CREDENTIALS_JSON:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,SENTRY_DSN=SENTRY_DSN:latest,TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest"

          # ALERT_CHANNEL: 'console' (shadow, default) or 'telegram' (live).
          # TELEGRAM_CHANNEL_ID: private-channel numeric id (-100…), set as a
          # GitHub var once the channel exists — only read when channel=telegram.
          ENV_VARS="--set-env-vars=GOOGLE_DRIVE_AUDIO_FOLDER_ID=${{ vars.GOOGLE_DRIVE_AUDIO_FOLDER_ID }},GOOGLE_DRIVE_BRIEFS_FOLDER_ID=${{ vars.GOOGLE_DRIVE_BRIEFS_FOLDER_ID }},ALERT_CHANNEL=${{ vars.ALERT_CHANNEL || 'console' }},TELEGRAM_CHANNEL_ID=${{ vars.TELEGRAM_CHANNEL_ID }},GIT_COMMIT_SHA=${{ github.sha }}"

          deploy_job() {
            local name=$1
            local memory=$2
            shift 2
            local args="$@"

            echo "--- Deploying ${name} (${memory}) ---"
            if gcloud run jobs describe "${name}" --region="${REGION}" --format="value(name)" 2>/dev/null; then
              gcloud run jobs update "${name}" \
                --image="${IMAGE}" \
                --memory="${memory}" \
                --cpu=1 \
                --args="${args}" \
                ${COMMON_FLAGS} ${SECRETS} ${ENV_VARS}
            else
              gcloud run jobs create "${name}" \
                --image="${IMAGE}" \
                --memory="${memory}" \
                --cpu=1 \
                --args="${args}" \
                ${COMMON_FLAGS} ${SECRETS} ${ENV_VARS}
            fi
          }

          # Barchart now reads active contract from DB (ref_contract.is_active)
          # ACTIVE_CONTRACT env var removed — use `poetry run roll-contract <code>` to switch
          deploy_job cc-barchart-scraper     2Gi  "barchart-scraper"
          deploy_job cc-ice-stocks-scraper   512Mi "ice-stocks-scraper"
          deploy_job cc-cftc-scraper         512Mi "cftc-scraper"
          # --language both → one execution writes the fr row then the native
          # EN (Ghana) row (no per-language jobs). EN content is generated but
          # stays unserved until VITE_FEATURE_LANG_SWITCHER is flipped ON.
          deploy_job cc-press-review-agent   1Gi  "press-review,--language,both"
          deploy_job cc-meteo-agent          1Gi  "meteo-agent,--language,both"
          # --stage all: the per-version decision rows AND the algorithm-independent
          # dashboard gauges, which reuse this run's smoothing/z-score pass.
          # Either half is relaunchable alone with --stage indicators|gauges.
          deploy_job cc-compute-indicators   1Gi  "compute-indicators,--all-contracts,--all-versions,--stage,all"
          # cc-daily-analysis and cc-compass-brief — REMOVED 2026-08-18 with the
          # regime+judge bascule. Their Cloud Run jobs are deleted on the next
          # deploy; the pl_indicator_daily rows they wrote stay as audit trail.
          # External-data scrapers for Campaign 5 ensemble (ENSO monthly, FX daily).
          # Write to pl_external_indicator (commodity-agnostic). See
          # docs/user-stories/P1-scraper-{enso,fx}.md.
          deploy_job cc-enso-scraper         512Mi "enso-scraper"
          deploy_job cc-fx-scraper           512Mi "fx-scraper"
          # EU positioning + stock scrapers for Campaign 5 ensemble. See
          # docs/user-stories/P1-scrapers-stock-cot-eu.md.
          # COT EU writes to pl_cot_eu_weekly (weekly snapshot, ICE publishes Friday).
          # Stock EU updates pl_contract_data_daily.stock_eu_bags60kg.
          deploy_job cc-ice-cot-eu-scraper   512Mi "ice-cot-eu-scraper"
          deploy_job cc-barchart-stocks-eu-scraper 512Mi "barchart-stocks-eu-scraper"
          # Campaign 5 ensemble — REMOVED 2026-08-18. The soft-gate, the Compass
          # wrapper and the artefact bootstrap are gone with the vendored pack.
          # pl_orchestrator_decision / pl_specialist_prediction keep their rows.
          # Campaign 6 regime + judge — INERT shadow, bundled in one Cloud Run job.
          # cc-regime-shadow computes the regime (Layer-1+2) decision, writes
          # pl_regime_shadow, then invokes the judge macro overlay (Layer-3, o4-mini
          # LLM reading press + weather from the DB) and writes pl_judge_shadow.
          # Neither layer ever writes a shared table (pl_indicator_daily etc.).
          # Runs on the current image (sklearn 1.5.2 — regime output verified
          # identical to its 1.6.1 freeze; judge is pure JSON+HTTP, no ML deps).
          # OPENAI_API_KEY is inherited from the shared SECRETS above (same
          # provider as press-review). Bootstrap job has no scheduler — trigger
          # manually to (re)load the frozen pack after a merge, or when R&D ships
          # a new one. Judge has no bootstrap step (config + prompt live in code).
          # The `regime-shadow-compute` entry point runs both layers; add
          # --no-judge for regime-only manual runs. Standalone judge reruns:
          # `poetry run judge-shadow-compute --session-date T`.
          deploy_job cc-regime-bootstrap-artifacts   1Gi  "regime-bootstrap-artifacts"
          deploy_job cc-regime-shadow                1Gi  "regime-shadow-compute"
          # Narrative + Drive brief for the regime+judge system. Merges what
          # would otherwise be two jobs (explainer + brief): the prose is
          # written once per language and lands in both the .txt and the served
          # row, so the dashboard and the brief cannot disagree.
          deploy_job cc-regime-brief                 1Gi  "regime-brief,--language,both"
          # Quarterly fundamentals (P3 user story). Gated on
          # ref_publication_calendar so the daily cron is cheap when no
          # publication is pending.
          deploy_job cc-eca-grindings-scraper        512Mi "eca-grindings-scraper"
          # 1Gi: NCA fetches through headless Chromium (SiteGround sgcaptcha WAF
          # bypass — see nca_grindings_scraper/config.py). Matches press-review.
          deploy_job cc-nca-grindings-scraper        1Gi   "nca-grindings-scraper"
          # Daily watchdog: alert on fundamentals publications overdue ≥21 days.
          # 512Mi minimum required by Cloud Run gen2 + always-allocated CPU.
          deploy_job cc-publication-calendar-watchdog 512Mi "publication-calendar-watchdog"
          # Roll watchdog: nudge the operator when the liquidity front-month
          # leads the calendar for ≥3 consecutive sessions (time to roll-contract).
          deploy_job cc-roll-watchdog                 512Mi "roll-watchdog"
          # Dual-track brief — REMOVED 2026-08-18. cc-ensemble-explainer and
          # cc-compass-brief-ensemble were the ensemble half; cc-regime-brief is
          # the single track now.
          # Dashboard publication gate. Runs every 30 min across the evening→
          # next-morning window; stamps pl_session_release once a session's data
          # is complete + its NotebookLM audio is present (morning fallback so a
          # late audio never freezes the dashboard). Drives the atomic same-
          # evening flip. See docs/runbooks/session-publish-gate.md.
          deploy_job cc-publish-session          512Mi "publish-session"
          # Intraday threshold monitor: 15-min delayed-price polling during the
          # London session; fires level-invalidation alerts (S1/R1) to the
          # Telegram channel — first-cross-only per (rule, session), dedup at
          # the data level (aud_alert_event). Pure httpx (no Playwright).
          # ALERT_CHANNEL=console until the Telegram channel is provisioned,
          # then flip the GitHub var to telegram (+ set TELEGRAM_CHANNEL_ID).
          deploy_job cc-intraday-monitor         512Mi "intraday-monitor"

  sentry-release:
    name: Create Sentry Release
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, deploy-jobs]
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: commodities-compass
          SENTRY_PROJECT: commodities-compass
        with:
          environment: production
          version: ${{ github.sha }}
          set_commits: auto
          finalize: true
