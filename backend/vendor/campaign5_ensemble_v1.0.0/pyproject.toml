[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble"
version = "1.0.0"
description = "Campaign 5 production ensemble — 14 specialists + soft-gate Bayesian orchestrator + transition-protection wrapper"
authors = [{ name = "R&D Commodities Compass" }]
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    "numpy==1.26.4",
    "pandas>=2.1,<2.3",
    "scipy>=1.11,<1.13",
    "scikit-learn>=1.4,<1.6",
    "lightgbm>=4.1,<4.5",
    "arch>=6.3",
    "hmmlearn>=0.3",
    "optuna>=3.5",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
testing = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ensemble*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, no-IO tests (default in CI)",
    "integration: tests that require the freezer output, a Postgres, or the R&D snapshot",
]
addopts = "-q -m unit"
