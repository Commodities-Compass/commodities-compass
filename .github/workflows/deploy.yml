name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/commodities-compass
  SA_API: cc-cloud-run-api@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  SA_JOBS: cc-cloud-run-jobs@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
  VPC_CONNECTOR: cc-vpc-connector

jobs:
  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Build and push backend image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/backend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/backend:latest \
            backend/
          docker push --all-tags ${{ env.REGISTRY }}/backend

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: backend
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.REGISTRY }}/backend:${{ github.sha }}
          flags: >-
            --service-account=${{ env.SA_API }}
            --vpc-connector=${{ env.VPC_CONNECTOR }}
            --vpc-egress=private-ranges-only
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=2
            --port=8000
            --allow-unauthenticated
          env_vars: |
            GOOGLE_DRIVE_AUDIO_FOLDER_ID=${{ vars.GOOGLE_DRIVE_AUDIO_FOLDER_ID }}
            BACKEND_CORS_ORIGINS=${{ vars.BACKEND_CORS_ORIGINS }}
            GIT_COMMIT_SHA=${{ github.sha }}
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            DATABASE_SYNC_URL=DATABASE_SYNC_URL:latest
            AUTH0_DOMAIN=AUTH0_DOMAIN:latest
            AUTH0_CLIENT_ID=AUTH0_CLIENT_ID:latest
            AUTH0_API_AUDIENCE=AUTH0_API_AUDIENCE:latest
            AUTH0_ISSUER=AUTH0_ISSUER:latest
            GOOGLE_DRIVE_CREDENTIALS_JSON=GOOGLE_DRIVE_CREDENTIALS_JSON:latest
            SENTRY_DSN=SENTRY_DSN:latest

  deploy-frontend:
    name: Deploy Frontend to Cloud Run
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Fetch SENTRY_DSN from GCP Secret Manager
        id: sentry-dsn
        run: |
          DSN=$(gcloud secrets versions access latest --secret=SENTRY_DSN --project=${{ vars.GCP_PROJECT_ID }})
          echo "::add-mask::$DSN"
          echo "value=$DSN" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg AUTH0_DOMAIN=${{ vars.AUTH0_DOMAIN }} \
            --build-arg AUTH0_CLIENT_ID=${{ vars.AUTH0_CLIENT_ID }} \
            --build-arg AUTH0_API_AUDIENCE=${{ vars.AUTH0_API_AUDIENCE }} \
            --build-arg AUTH0_REDIRECT_URI=${{ vars.FRONTEND_URL }} \
            --build-arg API_BASE_URL=${{ vars.API_BASE_URL }} \
            --build-arg AUTH0_ISSUER=${{ vars.AUTH0_ISSUER }} \
            --build-arg SENTRY_DSN=${{ steps.sentry-dsn.outputs.value }} \
            --build-arg GIT_COMMIT_SHA=${{ github.sha }} \
            --build-arg SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }} \
            --build-arg ENVIRONMENT=production \
            -t ${{ env.REGISTRY }}/frontend:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/frontend:latest \
            frontend/
          docker push --all-tags ${{ env.REGISTRY }}/frontend

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: frontend
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          flags: >-
            --service-account=${{ env.SA_API }}
            --memory=256Mi
            --cpu=1
            --min-instances=0
            --max-instances=2
            --port=3000
            --allow-unauthenticated

  deploy-jobs:
    name: Deploy Cloud Run Jobs
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev

      - name: Build and push jobs image
        run: |
          docker build \
            -f backend/Dockerfile.jobs \
            -t ${{ env.REGISTRY }}/jobs:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/jobs:latest \
            backend/
          docker push --all-tags ${{ env.REGISTRY }}/jobs

      - name: Deploy Cloud Run Jobs
        run: |
          IMAGE="${{ env.REGISTRY }}/jobs:${{ github.sha }}"
          REGION="${{ vars.GCP_REGION }}"
          SA="${{ env.SA_JOBS }}"
          VPC="${{ env.VPC_CONNECTOR }}"

          COMMON_FLAGS="--region=${REGION} --service-account=${SA} --vpc-connector=${VPC} --vpc-egress=private-ranges-only --max-retries=0 --task-timeout=900s"

          SECRETS="--set-secrets=DATABASE_URL=DATABASE_URL:latest,DATABASE_SYNC_URL=DATABASE_SYNC_URL:latest,GOOGLE_SHEETS_CREDENTIALS_JSON=GOOGLE_SHEETS_CREDENTIALS_JSON:latest,GOOGLE_SHEETS_SCRAPER_CREDENTIALS_JSON=GOOGLE_SHEETS_SCRAPER_CREDENTIALS_JSON:latest,GOOGLE_DRIVE_CREDENTIALS_JSON=GOOGLE_DRIVE_CREDENTIALS_JSON:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,SENTRY_DSN=SENTRY_DSN:latest"

          ENV_VARS="--set-env-vars=GOOGLE_DRIVE_AUDIO_FOLDER_ID=${{ vars.GOOGLE_DRIVE_AUDIO_FOLDER_ID }},GOOGLE_DRIVE_BRIEFS_FOLDER_ID=${{ vars.GOOGLE_DRIVE_BRIEFS_FOLDER_ID }},GIT_COMMIT_SHA=${{ github.sha }}"

          deploy_job() {
            local name=$1
            local memory=$2
            shift 2
            local args="$@"

            echo "--- Deploying ${name} (${memory}) ---"
            if gcloud run jobs describe "${name}" --region="${REGION}" --format="value(name)" 2>/dev/null; then
              gcloud run jobs update "${name}" \
                --image="${IMAGE}" \
                --memory="${memory}" \
                --cpu=1 \
                --args="${args}" \
                ${COMMON_FLAGS} ${SECRETS} ${ENV_VARS}
            else
              gcloud run jobs create "${name}" \
                --image="${IMAGE}" \
                --memory="${memory}" \
                --cpu=1 \
                --args="${args}" \
                ${COMMON_FLAGS} ${SECRETS} ${ENV_VARS}
            fi
          }

          # Barchart now reads active contract from DB (ref_contract.is_active)
          # ACTIVE_CONTRACT env var removed — use `poetry run roll-contract <code>` to switch
          deploy_job cc-barchart-scraper     2Gi  "barchart-scraper"
          deploy_job cc-ice-stocks-scraper   512Mi "ice-stocks-scraper"
          deploy_job cc-cftc-scraper         512Mi "cftc-scraper"
          deploy_job cc-press-review-agent   1Gi  "press-review"
          deploy_job cc-meteo-agent          1Gi  "meteo-agent"
          deploy_job cc-compute-indicators   1Gi  "compute-indicators,--all-contracts,--all-versions"
          # Pinned to "legacy" so daily-analysis NEVER overwrites the
          # C5 ensemble's pl_indicator_daily row, even when the ensemble
          # version is the one with is_active=TRUE. See
          # docs/user-stories/P2-daily-analysis-version-flag.md.
          deploy_job cc-daily-analysis       1Gi  "daily-analysis,--algorithm-version,legacy"
          deploy_job cc-compass-brief        1Gi  "compass-brief"
          # External-data scrapers for Campaign 5 ensemble (ENSO monthly, FX daily).
          # Write to pl_external_indicator (commodity-agnostic). See
          # docs/user-stories/P1-scraper-{enso,fx}.md.
          deploy_job cc-enso-scraper         512Mi "enso-scraper"
          deploy_job cc-fx-scraper           512Mi "fx-scraper"
          # EU positioning + stock scrapers for Campaign 5 ensemble. See
          # docs/user-stories/P1-scrapers-stock-cot-eu.md.
          # COT EU writes to pl_cot_eu_weekly (weekly snapshot, ICE publishes Friday).
          # Stock EU updates pl_contract_data_daily.stock_eu_bags60kg.
          deploy_job cc-ice-cot-eu-scraper   512Mi "ice-cot-eu-scraper"
          deploy_job cc-barchart-stocks-eu-scraper 512Mi "barchart-stocks-eu-scraper"
          # Campaign 5 ensemble: daily soft-gate + Compass wrapper decision.
          # Reads pl_contract_data_daily / pl_derived_indicators / pl_article_segment,
          # writes 14 specialist_prediction + 1 orchestrator_decision + 1 indicator_daily.
          # Shadow mode v1.0.0: dashboard ignores via is_active=FALSE (migration m7h8i9j0k1l2).
          # Bootstrap job (cc-ensemble-bootstrap-artifacts) is deployed without a scheduler
          # — trigger manually via gcloud when R&D ships a new frozen artefact pack.
          deploy_job cc-ensemble-bootstrap-artifacts 1Gi  "ensemble-bootstrap-artifacts"
          deploy_job cc-ensemble-compute             1Gi  "ensemble-compute"
          # Quarterly fundamentals (P3 user story). Gated on
          # ref_publication_calendar so the daily cron is cheap when no
          # publication is pending.
          deploy_job cc-eca-grindings-scraper        512Mi "eca-grindings-scraper"
          deploy_job cc-nca-grindings-scraper        512Mi "nca-grindings-scraper"
          # Daily watchdog: alert on fundamentals publications overdue ≥21 days.
          # 512Mi minimum required by Cloud Run gen2 + always-allocated CPU.
          deploy_job cc-publication-calendar-watchdog 512Mi "publication-calendar-watchdog"
          # Dual-track brief — ensemble side. cc-ensemble-explainer enriches the
          # ensemble row of pl_indicator_daily with LLM narrative (eco/confidence/
          # direction/conclusion). cc-compass-brief-ensemble assembles the new
          # 7-section brief and uploads to Drive with `-Ensemble` suffix. Both
          # run independently of the legacy track (cc-daily-analysis + cc-compass-brief
          # which remain active for the legacy brief on the same dates).
          # See docs/runbooks/brief-dual-track.md.
          deploy_job cc-ensemble-explainer       1Gi  "ensemble-explainer"
          deploy_job cc-compass-brief-ensemble   1Gi  "compass-brief-ensemble"
          # Dashboard publication gate. Runs every 30 min across the evening→
          # next-morning window; stamps pl_session_release once a session's data
          # is complete + its NotebookLM audio is present (morning fallback so a
          # late audio never freezes the dashboard). Drives the atomic same-
          # evening flip. See docs/runbooks/session-publish-gate.md.
          deploy_job cc-publish-session          512Mi "publish-session"

  sentry-release:
    name: Create Sentry Release
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, deploy-jobs]
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: commodities-compass
          SENTRY_PROJECT: commodities-compass
        with:
          environment: production
          version: ${{ github.sha }}
          set_commits: auto
          finalize: true
